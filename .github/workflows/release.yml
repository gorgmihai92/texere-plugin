name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Check that the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version"
            exit 1
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # the release notes: .github/release-notes/<tag>.md if there is one, otherwise the tag's section of CHANGELOG.md
          notes=".github/release-notes/$tag.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            awk -v t="## $tag" 'index($0, t) == 1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > "$notes"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" --title="$tag" --notes-file="$notes" main.js manifest.json styles.css
          fi
