name: Release Obsidian plugin

# A new version in manifest.json, pushed to main: GitHub builds the plugin and prepares the release as a draft
# (main.js, manifest.json, styles.css and the release notes). The owner only clicks "Publish" on the Releases page.
# A tag pushed by hand (e.g. 0.4.2) still works: the files are added to that release.
on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml, ".github/release-notes/**"]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Which version
        id: v
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version $version"; exit 1
          fi
          # already published: nothing to do
          if gh release view "$version" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "Release $version is already published."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build plugin
        if: steps.v.outputs.skip != 'true'
        run: |
          npm ci
          npm run build

      - name: Prepare the release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.v.outputs.version }}"
          # the release notes: .github/release-notes/<version>.md if there is one, otherwise that version's section of CHANGELOG.md
          notes=".github/release-notes/$v.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            awk -v t="## $v" 'index($0, t) == 1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > "$notes"
          fi
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" main.js manifest.json styles.css --clobber
            gh release edit "$v" --notes-file "$notes"
          else
            gh release create "$v" --draft --title "$v" --target "$GITHUB_SHA" --notes-file "$notes" main.js manifest.json styles.css
          fi
